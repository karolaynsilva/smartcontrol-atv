<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios em Tempo Real</title>
    <link rel="stylesheet" href="assets/css/reltemporeal.css">
</head>
<body>

    <aside class="sidebar">
        <img src="assets/imagens/logo.png" alt="Smart Control">
    </aside>

    <div class="content-wrapper">

        <header class="topbar">
            <button type="button" class="btn-modo-escuro" id="btn-modo-escuro">Modo Escuro</button>
            <a href="dashboard.html"><button type="button" class="btn-voltar">Voltar</button></a>
        </header>

        <main>
            <h1>Relatórios em Tempo Real</h1>

            <div class="linha-topo">

                <div class="card card-online">
                    <h2>Usuários Online - Tempo Real</h2>

                    <svg viewBox="0 0 400 180" class="grafico-svg" preserveAspectRatio="xMidYMid meet">
                        <polyline points="10,140 50,60 90,150 130,90 170,70 210,100 250,60 290,80 330,40 370,20"
                                  fill="none" stroke="#7ab8e8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

                        <text x="10" y="130" class="valor-label-pequeno">24</text>
                        <text x="50" y="50" class="valor-label-pequeno">31</text>
                        <text x="250" y="50" class="valor-label-pequeno">29</text>

                        <circle cx="370" cy="20" r="5" fill="#1a2a5e"/>

                        <text x="10" y="165" class="eixo-label-x">24</text>
                        <text x="180" y="165" class="eixo-label-x">31</text>
                        <text x="350" y="165" class="eixo-label-x">29</text>
                    </svg>

                    <div class="bolha-valor">29</div>
                </div>

                <div class="coluna-lateral">
                    <div class="card card-info">
                        <p class="info-titulo">Média de Tempo de Sessão</p>
                        <p class="info-valor">08:32 min</p>
                    </div>

                    <div class="card card-info">
                        <p class="info-titulo">Novas Inscrições (Hoje)</p>
                        <p class="info-valor">15</p>
                    </div>
                </div>

            </div>

            <div class="card card-barras">
                <h2>Acessos por Módulo (Última Hora)</h2>

                <svg viewBox="0 0 400 220" class="grafico-svg" preserveAspectRatio="xMidYMid meet">
                    <line x1="30" y1="20" x2="30" y2="190" stroke="#e5e9f0" stroke-width="1"/>
                    <line x1="30" y1="190" x2="380" y2="190" stroke="#e5e9f0" stroke-width="1"/>

                    <text x="5" y="24" class="eixo-label">145</text>
                    <text x="5" y="80" class="eixo-label">100</text>
                    <text x="10" y="140" class="eixo-label">50</text>
                    <text x="15" y="194" class="eixo-label">0</text>

                    <rect x="60"  y="20"  width="60" height="170" rx="4" fill="#1a2a5e"/>
                    <rect x="180" y="88"  width="60" height="102" rx="4" fill="#1a2a5e"/>
                    <rect x="300" y="115" width="60" height="75"  rx="4" fill="#1a2a5e"/>

                    <text x="90"  y="12"  class="valor-label">145</text>
                    <text x="210" y="80"  class="valor-label">88</text>
                    <text x="330" y="107" class="valor-label">65</text>

                    <text x="90"  y="210" class="eixo-label-x">Cursos</text>
                    <text x="210" y="210" class="eixo-label-x">Fórum</text>
                    <text x="330" y="210" class="eixo-label-x">Biblioteca</text>
                </svg>
            </div>

        </main>
    </div>

    <script src="assets/js/reltemporeal.js"></script>

</body>
</html>
