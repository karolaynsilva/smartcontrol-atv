<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <p>Bem-vindo (a)</p>
    <p>Que bom ter você aqui!</p>
    <p>Acesse sua conta para continuar aprendendo, ensinando e evoluindo juntos.</p>
  </header>

    <main>
      <img src="assets/imagens/logo.png" alt="">
      <p>Acesse sua conta</p>

      <form method="get" action="dashboard.html" id="form-login" novalidate>
        <p><label for="email">E-mail</label></p>
        <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required>
        <span class="erro" id="erro-email"></span>

        <p><label for="senha">Senha</label></p>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required minlength="8">
        <span class="erro" id="erro-senha"></span>

        <p><a href="esqueceusenha.html">Esqueceu a senha</a></p>
        <p><button type="submit" id="btn-entrar">Entrar</button></p>
        ou
      </form>

      <form method="get" action="cadastro.html">
        <p><button type="submit">Criar nova conta</button></p>
      </form>
    </main>
    <footer>
      <p>Este ambiente é acessivel para todos. Se precisar de ajuda, <a href="#ajuda">clique aqui</a></p>
    </footer>

 <script src="assets/js/index.js"></script>
</body>
</html>
